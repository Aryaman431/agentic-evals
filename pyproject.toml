[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-evals"
version = "0.5.0"
description = "A standalone, framework-agnostic evaluation and scoring engine for LLM/agent outputs — extracted from AgenticLens's evaluation module."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "agentic-evals Contributors" }]
keywords = ["llm", "agents", "evaluation", "scoring", "llm-as-judge", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# Deliberately minimal: this package depends on nothing from AgenticLens or
# any other DeepAgentLabs project. It scores whatever trace-shaped data you
# give it (see EvalTrace/EvalSpan in models.py) — that's what makes it
# usable outside AgenticLens at all.
dependencies = [
  "pydantic>=2.0,<3",
  "pyyaml>=6.0,<7",
  "jsonschema>=4.23",
  "referencing>=0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "build>=1.2",
  "twine>=5.1",
]
voice = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
agentic-evals = "agentic_evals.cli:main"

[project.urls]
Homepage = "https://github.com/DeepAgentLabs/agentic-evals"
Repository = "https://github.com/DeepAgentLabs/agentic-evals"
Issues = "https://github.com/DeepAgentLabs/agentic-evals/issues"
Changelog = "https://github.com/DeepAgentLabs/agentic-evals/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_evals"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_evals"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["agentic_evals"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["jsonschema", "referencing", "referencing.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --cov=agentic_evals --cov-report=term-missing"

[tool.coverage.run]
source = ["src/agentic_evals"]

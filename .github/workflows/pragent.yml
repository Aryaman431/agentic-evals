name: PRAgent Review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  pragent:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PRAgent
        uses: actions/checkout@v4
        with:
          repository: DeepAgentLabs/pragent
          path: pragent
          token: ${{ secrets.PRAGENT_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PRAgent
        run: |
          python -m pip install --upgrade pip
          pip install -r pragent/requirements.txt

      - name: Run PRAgent review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          PYTHONPATH: ${{ github.workspace }}/pragent
        run: |
          python pragent/scripts/review_pr.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}"
